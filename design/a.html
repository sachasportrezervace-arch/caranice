<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Čáranice – návrh A Plakát</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root {
  --pole: #2F3FE3; --pole-lo: #2433C4; --ink: #17161F; --papir: #FFFFFF; --zluta: #FFD23F;
  --x: #FF6B4A; --o: #2BD4A4; --bila: #F6F7FF;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--pole); color: var(--bila); font: 500 15px/1.35 Figtree, system-ui, sans-serif; overflow: hidden; }
.app { height: 100dvh; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); gap: 10px; }
.disp { font-family: "Lilita One", system-ui; font-weight: 400; letter-spacing: .01em; }

/* horní lišta: dva hráči a skóre */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.hrac { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hrac.o { flex-direction: row-reverse; text-align: right; }
.ava { width: 46px; height: 46px; border-radius: 50%; background: var(--pole-lo); display: grid; place-items: center; overflow: hidden; flex: none; position: relative; }
.ava svg.hlava { width: 52px; height: 52px; margin-top: 8px; }
.hrac.x .ava { background: var(--x); } .hrac.o .ava { background: var(--o); }
.jm { font-weight: 700; font-size: 13px; opacity: .85; line-height: 1.1; }
.sk { font-size: 28px; line-height: 1; }
.kolo { text-align: center; font-size: 12px; font-weight: 700; opacity: .75; letter-spacing: .04em; }
.kolo b { display: block; font: 400 18px "Lilita One"; opacity: 1; letter-spacing: 0; }
.tuzka { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; }

/* zadání: žlutý štítek */
.zadani { background: var(--zluta); color: var(--ink); border-radius: 12px; padding: 8px 12px 8px 14px; display: flex; align-items: center; gap: 10px; transform: rotate(-1.2deg); box-shadow: 0 4px 0 var(--pole-lo); }
.zadani small { display: block; font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.zadani .slovo { font-size: 28px; line-height: 1; }
.zadani .mod { margin-left: auto; background: var(--ink); color: var(--zluta); border-radius: 8px; padding: 6px 9px; font-weight: 800; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.zadani .mod svg { width: 16px; height: 16px; }
.pismena { display: flex; gap: 5px; margin-top: 4px; }
.pismena i { width: 15px; height: 4px; background: var(--ink); border-radius: 2px; opacity: .8; }
.napoveda { margin-left: auto; border: 2px solid var(--ink); background: none; color: var(--ink); border-radius: 9px; padding: 6px 9px; font: 800 12px Figtree; }

/* plátno */
.stred { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.platno { flex: 1; min-height: 0; aspect-ratio: 4 / 5; max-width: 100%; background: var(--papir); border-radius: 16px; position: relative; box-shadow: 0 6px 0 var(--pole-lo); }
.platno svg { width: 100%; height: 100%; display: block; }
.platno .cas { position: absolute; top: 10px; right: 10px; background: var(--ink); color: #fff; border-radius: 10px; padding: 4px 10px; font: 400 20px "Lilita One"; }
.platno .zrcadlo { position: absolute; left: 50%; top: 10px; bottom: 10px; border-left: 2px dashed rgba(47,63,227,.25); }

/* sázková lišta: podpis hry */
.lista { width: 100%; max-width: 560px; }
.lista .drah { position: relative; height: 22px; background: var(--pole-lo); border-radius: 11px; }
.lista .okno { position: absolute; top: 0; bottom: 0; background: var(--zluta); border-radius: 11px; display: grid; place-items: center; color: transparent; font: 800 11px Figtree; }
.lista .okno.skryte { background: repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px); color: #fff; border: 2px dashed rgba(255,255,255,.55); }
.lista .jehla { position: absolute; top: -5px; bottom: -5px; width: 4px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 2px var(--ink); }
.lista .osa { display: flex; justify-content: space-between; font: 700 11px Figtree; opacity: .7; margin-top: 3px; padding: 0 2px; }
.lista .popis { font: 700 12px Figtree; margin-bottom: 4px; display: flex; justify-content: space-between; }
.lista .popis b { color: var(--zluta); }

/* nástroje kreslíře */
.nastroje { display: flex; align-items: center; gap: 8px; }
.barvy { display: flex; gap: 6px; flex: 1; flex-wrap: nowrap; }
.barvy i { width: 28px; height: 28px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
.barvy i.on { box-shadow: 0 0 0 3px var(--pole), 0 0 0 5px #fff; }
.ikbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--pole-lo); border: 0; color: #fff; display: grid; place-items: center; flex: none; }
.ikbtn svg { width: 22px; height: 22px; }
.hotovo { background: var(--zluta); color: var(--ink); border: 0; border-radius: 12px; height: 44px; padding: 0 18px; font: 400 19px "Lilita One"; box-shadow: 0 4px 0 #C99A00; }
.radek2 { display: flex; gap: 8px; align-items: center; }
.tloustky { display: flex; gap: 4px; background: var(--pole-lo); border-radius: 12px; padding: 4px; }
.tloustky i { width: 34px; height: 32px; border-radius: 9px; display: grid; place-items: center; }
.tloustky i.on { background: #fff; }
.tloustky i b { display: block; background: var(--ink); border-radius: 50%; }
.tloustky i:not(.on) b { background: #fff; }

/* hádač */
.tipy { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 26px; }
.tip { background: var(--pole-lo); border-radius: 8px; padding: 4px 9px; font-weight: 700; font-size: 13px; text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(255,255,255,.5); }
.tip.skoro { background: var(--zluta); color: var(--ink); text-decoration: none; }
.hadat { display: flex; gap: 8px; }
.hadat input { flex: 1; min-width: 0; height: 50px; border: 0; border-radius: 14px; padding: 0 16px; font: 700 18px Figtree; color: var(--ink); background: #fff; }
.hadat button { height: 50px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--zluta); color: var(--ink); font: 400 20px "Lilita One"; box-shadow: 0 4px 0 #C99A00; }

/* odhalení */
.odhal { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.dvojice { display: flex; gap: 6px; align-items: flex-end; }
.dvojice .postava { width: 150px; height: 190px; }
.vysl { font-size: 40px; line-height: 1; }
.vysl small { display: block; font: 700 14px Figtree; opacity: .8; margin-top: 6px; }
.body { display: flex; gap: 10px; }
.body div { background: var(--pole-lo); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
.body b { font: 400 24px "Lilita One"; color: var(--zluta); margin-right: 4px; }
.mini { width: 130px; aspect-ratio: 4/5; background: #fff; border-radius: 10px; transform: rotate(3deg); box-shadow: 0 5px 0 var(--pole-lo); }
.mini svg { width: 100%; height: 100%; }
.dal { background: var(--zluta); color: var(--ink); border: 0; border-radius: 14px; height: 54px; padding: 0 30px; font: 400 22px "Lilita One"; box-shadow: 0 5px 0 #C99A00; }

/* desktop: postavy po stranách plátna, bubliny s tipy */
@media (min-width: 900px) {
  .app { padding: 18px 28px; gap: 14px; }
  .top { max-width: 1100px; margin: 0 auto; width: 100%; }
  .scena { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: end; }
  .strana { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 10px; padding-bottom: 6px; position: relative; }
  .strana .postava { width: 220px; height: 275px; }
  .strana .cedule { font-size: 22px; }
  .stred { height: 100%; }
  .bublina { background: #fff; color: var(--ink); border-radius: 18px; padding: 10px 16px; font: 700 18px Figtree; position: relative; }
  .bublina::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .bublina s { text-decoration-thickness: 3px; text-decoration-color: var(--x); opacity: .7; margin-right: 8px; }
  .hadat { width: 100%; max-width: 330px; }
  .myslenka { position: absolute; top: 18%; font: 400 22px "Lilita One"; opacity: .9; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script type="module">
import { hlava, postava } from "../src/postavicky.js";
import { ukazkaSVG } from "./ukazka.js";
const s = new URLSearchParams(location.search).get("s") || "draw";
const desk = innerWidth >= 900;
const X = "#FF6B4A", O = "#2BD4A4";
const tuzka = `<svg class="tuzka" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#FFD23F"/><path d="M6 14l1-3 6-6 2 2-6 6z" fill="#17161F"/></svg>`;
const top = (vx, vo, kdoKresli) => `<div class="top">
  <div class="hrac x"><div class="ava">${hlava("kluk", vx)}${kdoKresli === "x" ? tuzka : ""}</div><div><div class="jm">Mark</div><div class="sk disp">7</div></div></div>
  <div class="kolo">KOLO<b>3 / 8</b></div>
  <div class="hrac o"><div class="ava">${hlava("holka", vo)}${kdoKresli === "o" ? tuzka : ""}</div><div><div class="jm">Radka</div><div class="sk disp">5</div></div></div>
</div>`;
const mirror = `<svg viewBox="0 0 16 16"><path d="M8 1v14M6 4 2 8l4 4zM10 4l4 4-4 4z" fill="#FFD23F" stroke="#FFD23F" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const lista = (skryte, jehla) => `<div class="lista">
  <div class="popis"><span>${skryte ? "Markova sázka je tajná" : "Tvoje sázka: <b>uhodne za 10–20 s</b>"}</span><span>+3 oběma</span></div>
  <div class="drah"><div class="okno ${skryte ? "skryte" : ""}" style="left:16.6%;width:16.7%">${skryte ? "?" : "SÁZKA"}</div><div class="jehla" style="left:${jehla}%"></div></div>
  <div class="osa"><span>0 s</span><span>20</span><span>40</span><span>60 s</span></div></div>`;
const platno = (cas, zrcadlo) => `<div class="platno">${ukazkaSVG()}${zrcadlo ? '<div class="zrcadlo"></div>' : ""}<div class="cas">${cas}</div></div>`;
const barvy = ["#17161F", "#E8402F", "#F5A623", "#FFD23F", "#2E9E5B", "#2F7DE3", "#8E4FD6", "#8A5A36"];
const nastroje = `<div class="nastroje"><div class="barvy">${barvy.map((c, i) => `<i style="background:${c}" class="${i === 2 ? "on" : ""}"></i>`).join("")}</div></div>
  <div class="radek2"><div class="tloustky"><i><b style="width:6px;height:6px"></b></i><i class="on"><b style="width:11px;height:11px"></b></i><i><b style="width:18px;height:18px"></b></i></div>
  <button class="ikbtn" aria-label="Zpět"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <span style="flex:1"></span><button class="hotovo">Hotovo</button></div>`;
const app = document.getElementById("app");
if (s === "draw" && !desk) {
  app.innerHTML = top("kresli", "mysli", "x") +
    `<div class="zadani"><div><small>Kreslíš</small><div class="slovo disp">žirafa</div></div><div class="mod">${mirror}Zrcadlově</div></div>
     <div class="stred">${platno("0:14", true)}${lista(false, 23)}</div>` + nastroje;
}
if (s === "guess" && !desk) {
  app.innerHTML = top("kresli", "mysli", "x") +
    `<div class="zadani"><div><small>Hádej, co kreslí Mark</small><div class="pismena">${"<i></i>".repeat(6)}</div></div><button class="napoveda">6 písmen</button></div>
     <div class="stred">${platno("0:14")}${lista(true, 23)}</div>
     <div class="tipy"><span class="tip">kůň</span><span class="tip">lama</span><span class="tip skoro">žirava</span></div>
     <div class="hadat"><input value="žir" aria-label="Tip"><button>Tipnout</button></div>`;
}
if (s === "reveal" && !desk) {
  app.innerHTML = top("radost", "radost", "") +
    `<div class="odhal"><div class="dvojice">${postava("kluk", "radost", X)}<div class="mini">${ukazkaSVG()}</div>${postava("holka", "radost", O)}</div>
     <div class="vysl disp">Trefa!<small>Radka uhodla <b>žirafu</b> za 14,2 s. Sázka byla 10–20 s.</small></div>
     ${lista(false, 23.6).replace("Tvoje sázka", "Sázka")}
     <div class="body"><div><b>+3</b>Mark</div><div><b>+3</b>Radka</div></div>
     <button class="dal">Teď kreslí Radka</button></div>`;
}
if (desk) {
  const guess = s !== "draw";
  app.innerHTML = top(guess ? "kresli" : "kresli", "mysli", "x") +
    `<div class="scena">
      <div class="strana">${postava("kluk", "kresli", X)}<div class="cedule disp">Mark kreslí</div></div>
      <div class="stred">
        ${guess ? `<div class="zadani"><div><small>Hádej, co kreslí Mark</small><div class="pismena">${"<i></i>".repeat(6)}</div></div><button class="napoveda">6 písmen</button></div>`
                : `<div class="zadani"><div><small>Kreslíš</small><div class="slovo disp">žirafa</div></div><div class="mod">${mirror}Zrcadlově</div></div>`}
        ${platno("0:14", !guess)}${lista(guess, 23)}${guess ? "" : nastroje}
      </div>
      <div class="strana"><div class="bublina"><s>kůň</s><s>lama</s>žirava?</div>${postava("holka", "mysli", O)}${guess ? `<div class="hadat"><input value="žir" aria-label="Tip"><button>Tipnout</button></div>` : `<div class="cedule disp">Radka hádá</div>`}</div>
    </div>`;
}
</script>
</body>
</html>
