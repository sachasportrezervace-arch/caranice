@font-face { font-family: Figtree; src: url(fonts/figtree800-ext.woff2) format("woff2"); font-weight: 651 900; font-display: swap;

:root {
  --pole: #2F3FE3; --pole-lo: #2433C4; --pole-hi: #4655F0; --ink: #17161F; --zluta: #FFD23F; --zluta-lo: #D9A800;
  --x: #FF6B4A; --o: #2BD4A4; --bila: #FFFFFF; --r: 14px; --vh: 100dvh;
  --disp: "Lilita One", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--pole); color: var(--bila); font: 600 16px/1.35 Figtree, system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
.disp { font-family: var(--disp); font-weight: 400; letter-spacing: .01em; }
[hidden] { display: none !important; }

#app { height: var(--vh); display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); gap: 8px; }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* hlavička: dva hráči, uprostřed kolo a stopky */
#top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.hrac { display: flex; align-items: center; gap: 6px; min-width: 0; }
.hrac.o { flex-direction: row-reverse; text-align: right; }
.hrac .hlava { width: 54px; height: 54px; flex: none; }
.hrac .jm { font-weight: 800; font-size: 14px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrac .sk { font: 400 30px/1 var(--disp); }
.hrac.x .jm { color: #FFD0C4; } .hrac.o .jm { color: #C2F5E6; }
.hrac .plus { font: 400 18px var(--disp); color: var(--zluta); margin: 0 4px; animation: plus 1.6s ease-out both; }
@keyframes plus { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 20% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
.mid { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.mid .kolo { font-weight: 800; font-size: 13px; }
.stopky { display: flex; align-items: center; gap: 6px; }
.stopky svg { width: 40px; height: 40px; }
.stopky b { font: 400 26px/1 var(--disp); min-width: 2ch; text-align: left; font-variant-numeric: tabular-nums; }
.pencil { width: 18px; height: 18px; flex: none; }

/* štítek se slovem: podpisový tvar hry */
.stitek { background: var(--zluta); color: var(--ink); border-radius: var(--r); padding: 8px 14px; display: flex; align-items: center; gap: 10px; transform: rotate(-1.2deg); min-height: 56px; flex: none; }
.stitek small { display: block; font-weight: 800; font-size: 14px; }
.stitek .slovo { font: 400 30px/1 var(--disp); overflow-wrap: anywhere; }
.stitek .vpravo { margin-left: auto; text-align: right; }
.pismena { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: flex-end; }
.pismena i { width: 14px; height: 4px; background: var(--ink); border-radius: 2px; font-style: normal; }
.pismena i.l { height: auto; width: auto; background: none; font: 400 20px/1 var(--disp); }
.pismena .mezera { width: 8px; background: none; }
.btn-hotovo { background: var(--ink); color: var(--zluta); border-radius: 12px; min-height: 40px; padding: 0 16px; font: 400 21px/1 var(--disp); white-space: nowrap; }
.btn-hotovo:active { transform: translateY(2px); }
.btn-line { border: 2.5px solid var(--ink); border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; }

/* plátno */
.plocha { flex: 1; min-height: 120px; position: relative; display: flex; align-items: center; justify-content: center; }
.platno { position: relative; background: #fff; border-radius: var(--r); overflow: hidden; touch-action: none; }
.platno canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.platno .mod { position: absolute; left: 10px; top: 10px; background: var(--ink); color: var(--zluta); border-radius: 10px; padding: 5px 10px; font-weight: 800; font-size: 14px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.platno .mod svg { width: 16px; height: 16px; }
.platno .osa { position: absolute; left: 50%; top: 12px; bottom: 12px; border-left: 2px dashed rgba(47,63,227,.25); pointer-events: none; }
.platno .slepe { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(23,22,31,.35); font: 400 26px var(--disp); pointer-events: none; text-align: center; padding: 20px; }
.platno .kurzor { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--pole); pointer-events: none; }
.platno .prazdne { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: rgba(23,22,31,.4); font: 400 24px/1.15 var(--disp); pointer-events: none; }

/* sázková lišta proti času */
.sazka { flex: none; }
.sazka .popis { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 14px; margin-bottom: 4px; }
.sazka .popis b { font: 400 20px var(--disp); color: var(--zluta); }
.drah { position: relative; height: 28px; background: var(--pole-lo); border-radius: 9px; }
.drah .okno { position: absolute; top: 0; bottom: 0; background: var(--zluta); border-radius: 9px; }
.drah .okno.tajne { background: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.drah .ubehlo { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.16); border-radius: 9px 0 0 9px; }
.drah .jehla { position: absolute; top: -4px; bottom: -4px; width: 5px; margin-left: -2.5px; background: #fff; border-radius: 3px; box-shadow: 0 0 0 2px var(--ink); }
.drah .zasah { position: absolute; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; }
.drah .zasah.ok { background: var(--zluta); color: var(--ink); }
.drah .zasah svg { width: 16px; height: 16px; }
.osa-s { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-top: 3px; padding: 0 1px; }
.drah input[type=range] { position: absolute; inset: -8px 0; width: 100%; height: 44px; opacity: 0; cursor: grab; touch-action: none; }

/* nástroje kreslíře: jeden řádek */
.nastroje { display: flex; align-items: center; gap: 8px; flex: none; }
.barvy { display: flex; gap: 7px; flex: 1; min-width: 0; padding: 0 6px; }
.barva { width: 32px; height: 32px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.9); }
.barva.on { box-shadow: 0 0 0 2.5px var(--pole), 0 0 0 5px #fff; }
.ik { width: 42px; height: 42px; border-radius: 12px; background: var(--pole-lo); display: grid; place-items: center; flex: none; }
.ik svg { width: 24px; height: 24px; }
.ik:disabled { opacity: .4; }
.tl { position: relative; }
.platno .tipy.nad { position: absolute; left: 10px; right: 10px; bottom: 10px; min-height: 0; pointer-events: none; }
.tl b { display: block; width: 24px; background: #fff; border-radius: 9px; }

/* tlačítka: hlavní žlutá, vedlejší obrys */
.btn { background: var(--zluta); color: var(--ink); border-radius: var(--r); min-height: 52px; padding: 0 22px; font: 400 22px/1 var(--disp); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(2px); }
.btn:disabled { opacity: .5; }
.btn.alt { background: transparent; color: #fff; box-shadow: inset 0 0 0 2.5px rgba(255,255,255,.85); font: 800 17px Figtree; }
.btn.sm { min-height: 44px; font-size: 19px; padding: 0 16px; }

/* hádač */
.tipy { display: flex; gap: 6px; overflow: hidden; min-height: 28px; flex: none; align-items: center; }
.tip { background: var(--pole-lo); border-radius: 8px; padding: 3px 9px; font-weight: 800; font-size: 14px; white-space: nowrap; text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(255,255,255,.55); }
.tip.skoro { background: var(--zluta); color: var(--ink); text-decoration: none; }
.tip.ok { background: var(--o); color: var(--ink); text-decoration: none; }
.tipy .napis { font-weight: 800; font-size: 14px; opacity: .9; }
.hadat { display: flex; gap: 8px; flex: none; }
.hadat input { flex: 1; min-width: 0; height: 52px; border: 0; border-radius: var(--r); padding: 0 16px; font: 800 19px Figtree; color: var(--ink); background: #fff; outline: none; }
.hadat input:focus { box-shadow: 0 0 0 3px var(--zluta); }
.hadat .ik { height: 52px; width: 52px; background: transparent; box-shadow: inset 0 0 0 2.5px rgba(255,255,255,.6); }

/* obecné obrazovky (menu, výzva, čekání) */
.panel { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 8px 4px; }
.panel h1 { font: 400 clamp(52px, 15vw, 96px)/.9 var(--disp); transform: rotate(-2deg); }
.panel h1 span { display: inline-block; background: var(--zluta); color: var(--ink); padding: 4px 14px 8px; border-radius: var(--r); }
.panel h2 { font: 400 clamp(28px, 7.5vw, 44px)/1.05 var(--disp); max-width: 16ch; }
.panel p { max-width: 34ch; font-size: 17px; }
.panel .pravidla { list-style: none; padding: 0; display: grid; gap: 8px; max-width: 360px; text-align: left; }
.panel .pravidla li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.panel .pravidla b.n { font: 400 20px/1 var(--disp); background: #fff; color: var(--pole); border-radius: 8px; min-width: 28px; height: 28px; display: grid; place-items: center; flex: none; }
.pole { width: min(360px, 100%); display: grid; gap: 8px; text-align: left; }
.pole label { font-weight: 800; font-size: 15px; }
.pole input { height: 54px; border: 0; border-radius: var(--r); padding: 0 16px; font: 800 20px Figtree; color: var(--ink); background: #fff; outline: none; width: 100%; }
.pole input:focus { box-shadow: 0 0 0 3px var(--zluta); }
.avatary { display: flex; gap: 8px; justify-content: space-between; }
.avatar { flex: 1; aspect-ratio: 1; border-radius: var(--r); background: var(--pole-lo); padding: 6px; }
.avatar.on { background: #fff; }
.avatar svg { width: 100%; height: 100%; }
.dvojice { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.dvojice .postava { width: min(150px, 36vw); height: auto; }
.odkaz { width: min(420px, 100%); background: var(--pole-lo); border-radius: var(--r); padding: 12px 14px; font-weight: 800; word-break: break-all; font-size: 15px; }
.akce { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.male { font-size: 14px; opacity: .9; }
.odkazbtn { text-decoration: underline; text-underline-offset: 3px; font-weight: 800; font-size: 15px; padding: 6px; }

/* plakát: úvod, pozvánka, odkaz */
.dva .lev, .dva .prav, .dva .kop, .dva .forma { display: contents; }
.dva .logo { order: 0; } .dva .kop > * { order: 1; } .dva .pravidla { order: 2; } .dva .forma > * { order: 3; }
.dva.intro .logo, .dva.share .lev { display: none; }
.dva .nahled { display: none; }
.dva.intro { gap: 10px; } .dva.intro .dvojice .postava { width: 82px; } .dva.intro h2 { font-size: 26px; }

/* výběr slova */
.karty { display: grid; gap: 8px; width: min(420px, 100%); }
.karta { background: #fff; color: var(--ink); border-radius: var(--r); padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 62px; }
.karta .slovo { font: 400 26px/1 var(--disp); flex: 1; overflow-wrap: anywhere; }
.karta small { font-weight: 800; font-size: 13px; color: #555; white-space: nowrap; text-align: right; }
.karta.on { background: var(--zluta); }
.karta input { flex: 1; min-width: 0; border: 0; font: 400 24px var(--disp); color: var(--ink); background: transparent; outline: none; }
.karta.vlastni { background: transparent; color: #fff; box-shadow: inset 0 0 0 2.5px rgba(255,255,255,.7); }
.karta.vlastni.on { background: #fff; color: var(--ink); }
.karta.vlastni input { color: inherit; }
.karta.vlastni input::placeholder { color: inherit; opacity: .75; }
.vyber { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0; }
.vyber .sazka { width: min(420px, 100%); margin-top: 6px; }
.vyber .sazka .popis { margin-bottom: 16px; }
.vyber .drah { height: 34px; }
.vyber .drah input[type=range] { inset: -2px 0; height: 38px; }
.vyber h2 { font: 400 26px var(--disp); }
.modinfo { background: var(--ink); color: var(--zluta); border-radius: var(--r); padding: 10px 14px; display: flex; gap: 10px; align-items: center; width: min(420px, 100%); text-align: left; font-size: 15px; }
.modinfo b { font: 400 20px var(--disp); display: block; }
.modinfo svg { width: 28px; height: 28px; flex: none; }
.pomoc { background: var(--o); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 14px; }

/* odhalení: pole se rozdělí do barev hráčů */
body.odhal { background: linear-gradient(105deg, var(--x) 0 50%, var(--o) 50% 100%); }
body.odhal .stitek, body.odhal .drah { box-shadow: none; }
.odhaleni { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.odhaleni .verdikt { font: 400 clamp(56px, 16vw, 96px)/.9 var(--disp); color: #fff; text-shadow: 0 4px 0 rgba(23,22,31,.25); }
.odhaleni .detail { font-weight: 800; font-size: 18px; color: var(--ink); background: #fff; border-radius: 10px; padding: 6px 12px; }
.odhaleni .scena { display: flex; align-items: flex-end; justify-content: center; gap: 0; width: 100%; }
.odhaleni .scena .postava { width: min(120px, 28vw); height: auto; flex: none; }
.odhaleni .mini { width: min(170px, 40vw); aspect-ratio: 4/5; background: #fff; border-radius: 12px; transform: rotate(2.5deg); overflow: hidden; flex: none; }
.odhaleni .mini svg { width: 100%; height: 100%; display: block; }
.odhaleni .sazka { width: min(440px, 100%); color: var(--ink); }
.odhaleni .sazka .popis b { color: var(--ink); }
.odhaleni .drah { background: rgba(23,22,31,.22); }
.odhaleni .osa-s { color: var(--ink); }

/* konec partie a galerie */
.konec { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 8px 0 16px; }
.konec h2 { font: 400 clamp(40px, 11vw, 72px)/.95 var(--disp); }
.konec h2.gal { font-size: 28px; }
.vysledek { display: flex; gap: 18px; align-items: center; justify-content: center; }
.vysledek .strana { display: flex; flex-direction: column; align-items: center; }
.vysledek .postava { width: min(130px, 32vw); height: auto; }
.vysledek .sk { font: 400 54px/1 var(--disp); }
.vysledek .dvoj { font: 400 40px var(--disp); opacity: .7; }
.tituly { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
.titul { background: #fff; color: var(--ink); border-radius: 12px; padding: 8px 12px; text-align: left; max-width: 260px; }
.titul b { font: 400 19px var(--disp); display: block; }
.titul span { font-size: 13px; font-weight: 700; }
.titul.x { box-shadow: inset 6px 0 0 var(--x); padding-left: 16px; }
.titul.o { box-shadow: inset 6px 0 0 var(--o); padding-left: 16px; }
.galerie { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(560px, 100%); }
.obraz { background: #fff; border-radius: 12px; overflow: hidden; color: var(--ink); text-align: left; transform: rotate(var(--rot, 0deg)); }
.obraz .kr { aspect-ratio: 4/5; }
.obraz .kr svg { width: 100%; height: 100%; display: block; }
.obraz .pod { padding: 4px 8px 6px; font-size: 12px; font-weight: 700; border-top: 3px solid var(--c, var(--x)); }
.obraz .pod b { font: 400 16px/1.1 var(--disp); display: block; overflow-wrap: anywhere; }
.serie { font-weight: 800; }
.serie b { font: 400 24px var(--disp); }

/* desktop: postavy po stranách plátna, bubliny */
.strana-l, .strana-p { display: none; }
@media (min-width: 900px) and (min-height: 560px) {
  #app { padding: 18px 28px; gap: 12px; }
  #top { max-width: 1180px; margin: 0 auto; width: 100%; }
  .hrac { gap: 12px; }
  .hrac .hlava { width: 76px; height: 76px; }
  .hrac .sk { font-size: 48px; } .hrac .jm { font-size: 20px; }
  .mid .kolo { font-size: 16px; }
  .stopky svg { width: 56px; height: 56px; } .stopky b { font-size: 38px; }
  .stitek small { font-size: 16px; }
  .sazka .popis { font-size: 16px; } .sazka .popis b { font-size: 24px; }
  .osa-s { font-size: 15px; }
  .btn-line { font-size: 15px; } .tip, .tipy .napis, .platno .mod, .pomoc { font-size: 15px; }
  .titul span, .karta small { font-size: 14px; } .male { font-size: 15px; }
  .round { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr minmax(0, auto) 1fr; gap: 28px; width: 100%; max-width: 1280px; margin: 0 auto; }
  .round .stred { display: flex; flex-direction: column; gap: 10px; min-height: 0; width: min(62vh, 560px); }
  .strana-l, .strana-p { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 8px; min-width: 0; }
  .strana-l .postava, .strana-p .postava { width: min(230px, 100%); height: auto; }
